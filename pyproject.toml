[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kontho"
version = "1.0.0"
description = "Universal Local Voice Typing for Windows with Bengali and English Code-Switching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kontho Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "PySide6>=6.5.0",
    "pywhispercpp>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pywin32>=306",
]

[project.scripts]
kontho = "kontho.ui.app:main"

[project.urls]
"Homepage" = "https://github.com/jony100200/Kontho"
"Bug Tracker" = "https://github.com/jony100200/Kontho/issues"
